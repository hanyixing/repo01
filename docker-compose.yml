version: "3.8"

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:5.7
    container_name: community-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-community}
      MYSQL_USER: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - community-net

  # ==================== App ====================
  community:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    ports:
      - "${SERVER_PORT:-8887}:8887"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8887/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - community-net

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local

networks:
  community-net:
    driver: bridge
