# ============================================================
# Shared configuration (profile-independent)
# Profile-specific overrides in application-{dev,test,prod}.yml
# ============================================================

# Default profile -- overridden via -Dspring.profiles.active or env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Server ----
server.port=${SERVER_PORT:8887}
server.servlet.session.timeout=15552000

# ---- Upload ----
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---- MyBatis ----
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=life.majiang.community.mapper
mybatis.mapper-locations=classpath:mapper/*.xml

# ---- Logging ----
logging.file=logs/community.log
logging.level.root=info
logging.file.max-history=15
logging.file.max-size=100MB
