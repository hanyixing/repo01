# Production profile -- MySQL via env vars, Flyway auto-migration, all secrets externalized
# Activate: --spring.profiles.active=prod
spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:community}?useUnicode=true&characterEncoding=UTF-8&useSSL=false"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

github:
  client:
    id: ${GITHUB_CLIENT_ID:}
    secret: ${GITHUB_CLIENT_SECRET:}
  redirect:
    uri: ${GITHUB_REDIRECT_URI:}

gitee:
  client:
    id: ${GITEE_CLIENT_ID:}
    secret: ${GITEE_CLIENT_SECRET:}
  redirect:
    uri: ${GITEE_REDIRECT_URI:}

ucloud:
  ufile:
    bucket-name: ${UCLOUD_BUCKET_NAME:}
    bucket-type: ${UCLOUD_BUCKET_TYPE:private}
    expires-duration: ${UCLOUD_EXPIRES_DURATION:315360000}
    public-key: ${UCLOUD_PUBLIC_KEY:}
    private-key: ${UCLOUD_PRIVATE_KEY:}
    upload-domain: ${UCLOUD_UPLOAD_DOMAIN:}
    download-domain: ${UCLOUD_DOWNLOAD_DOMAIN:}
